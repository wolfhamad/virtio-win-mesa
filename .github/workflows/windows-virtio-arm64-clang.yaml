name: Build Mesa ARM64 (mingw-gcc cross)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

- name: Install system packages
  run: |
    sudo apt-get update
    sudo apt-get install -y mingw-w64
    sudo apt-get install -y \
      gcc-aarch64-w64-mingw32 g++-aarch64-w64-mingw32 \
      binutils-mingw-w64-cross pkg-config ninja-build p7zip-full git

    - name: Install Python modules (meson)
      run: |
        python -m pip install --upgrade pip
        pip install meson Mako PyYAML

    - name: Download D3D10UMD headers
      run: |
        git clone https://github.com/YWFhYmJi/d3d10umd-winddk-headers.git

    - name: Create meson cross file
      run: |
        cat > aarch64-w64-mingw32-cross.txt <<'EOF'
        [host_machine]
        system = 'windows'
        cpu_family = 'aarch64'
        cpu = 'aarch64'
        endian = 'little'

        [binaries]
        c = 'aarch64-w64-mingw32-gcc'
        cpp = 'aarch64-w64-mingw32-g++'
        ar = 'aarch64-w64-mingw32-ar'
        strip = 'aarch64-w64-mingw32-strip'
        pkgconfig = 'pkg-config'

        [properties]
        needs_exe_wrapper = true
        EOF

    - name: Configure and build Mesa (cross)
      env:
        WINDDK_INCLUDE: ${{ github.workspace }}/d3d10umd-winddk-headers
        MESA_PREFIX_ARM64: ${{ github.workspace }}/mesa_prefix_arm64
      run: |
        mkdir -p mesa_prefix_arm64
        rm -rf build
        mkdir -p build
        cd build
        meson setup .. --prefix="$MESA_PREFIX_ARM64" --cross-file "../aarch64-w64-mingw32-cross.txt" \
          -Dgallium-drivers=virgl \
          -Dgallium-d3d10umd=true \
          -Dgallium-wgl-dll-name=viogpu_wgl \
          -Dgallium-d3d10-dll-name=viogpu_d3d10 \
          -Dvulkan-drivers=virtio \
          -Dzlib=disabled \
          -Dc_std=c11 \
          -Dc_args="-I$WINDDK_INCLUDE" \
          -Dcpp_args="-I$WINDDK_INCLUDE"
        ninja -C build -j$(nproc) install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mesa_arm64_build
        path: mesa_prefix_arm64
